<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 新聞監測站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 頁首：標題與狀態 -->
  <header class="top">
    <h1>📡 AI 新聞監測站</h1>
    <p class="status">
      <span id="dot" class="dot"></span>
      <span id="status-text">準備中…</span>
    </p>
  </header>

  <main class="wrap">
    <!-- 主題按鈕：點了就切換要監測的關鍵字 -->
    <nav id="topics" class="topics"></nav>

    <!-- 搜尋列：自己輸入關鍵字 -->
    <form id="search-form" class="search">
      <input id="search-input" type="text" placeholder="輸入英文關鍵字，例如 robot、chip…">
      <button type="submit">搜尋</button>
      <button type="button" id="refresh-btn">立即更新</button>
      <button type="button" id="translate-btn">🈶 中文標題：開</button>
    </form>

    <!-- 統計小卡 -->
    <section class="stats">
      <div class="card"><span id="stat-total">0</span><small>則新聞</small></div>
      <div class="card"><span id="stat-new">0</span><small>則是新的</small></div>
      <div class="card"><span id="stat-hot">0</span><small>則熱門（100 分以上）</small></div>
    </section>

    <!-- 新聞列表會被 script.js 填進來 -->
    <ul id="news-list" class="news-list"></ul>
  </main>

  <footer class="foot">
    資料來源：Hacker News（Algolia 搜尋介面）・翻譯：Google 翻譯・每 5 分鐘自動更新
  </footer>

  <script src="script.js"></script>
</body>
</html>
